[package]
name = "libid-deploy"
version = "0.6.0"
edition = "2021"
rust-version = "1.94.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/libid-org/chain-configurations"
description = "Applies per-network declarative configuration to chains: every canonical address is pre-declared (CREATE3-deterministic), deployed-vs-not is read from chain state, and apply converges the chain onto the file without ever rewriting it."
publish = false

[dependencies]
libid-contracts = "0.5.0"
alloy = { version = "1", features = [
    "contract",
    "providers",
    "network",
    "transport-http",
    "serde",
    "signers",
    "signer-local",
    "signer-aws",
] }
# KMS-backed signing: `signer-aws` re-exports `alloy::signers::aws::AwsSigner`,
# but constructing one needs an aws_sdk_kms::Client, so the SDK crates are
# direct dependencies pinned to the 1.x line cargo unifies with alloy's.
aws-config = "1"
aws-sdk-kms = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
alloy = { version = "1", features = ["node-bindings"] }
tempfile = "3"
