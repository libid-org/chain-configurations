[package]
name = "libid-deploy"
version = "0.17.0"
edition = "2021"
rust-version = "1.94.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/libid-org/chain-configurations"
description = "Applies per-network declarative configuration to chains: every canonical address is pre-declared (CREATE3-deterministic), deployed-vs-not is read from chain state, and apply converges the chain onto the file without ever rewriting it."
publish = false

[dependencies]
libid-contracts = "0.20"
# The generated platform table: platform keys, whose keccak256 is the
# on-chain platform id. A key retyped here would name a platform no deployed
# verifier serves.
libid-identity = "0.20"
# The ceremony profile table: which sessions a platform notarizes, hence
# whether its Platform Verifier holds a Notary Service at all.
libid-profiles = "0.20"
alloy = { version = "2", features = [
    "contract",
    "providers",
    "provider-anvil-api",
    "network",
    "transport-http",
    "serde",
    "signers",
    "signer-local",
    "signer-aws",
] }
# KMS-backed signing: `signer-aws` re-exports `alloy::signers::aws::AwsSigner`,
# but constructing one needs an aws_sdk_kms::Client, so the SDK crates are
# direct dependencies pinned to the 1.x line cargo unifies with alloy's.
# The KMS SDK takes the default HTTPS client (hyper 1, rustls 0.23) without
# its `rustls` feature, which adds the hyper 0.14 / rustls 0.21 connector.
aws-config = "1"
aws-sdk-kms = { version = "1", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
alloy = { version = "2", features = ["node-bindings"] }
tempfile = "3"
