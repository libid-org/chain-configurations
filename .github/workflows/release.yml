name: Release

# On a published GitHub Release: build the `libid-deploy` binary for Linux
# x86_64 and aarch64 and upload both as release assets. The apply workflow's
# `source: release` path downloads the latest of these instead of compiling.
#
# aarch64 builds NATIVELY on GitHub's arm64 runners — no cross toolchain or
# zig to babysit, and the anvil tests could even run there if ever needed.
#
# Every third-party action is pinned by commit SHA, with the tag in a
# comment, so a moved tag cannot change what executes.

on:
  release:
    types: [published]

permissions:
  # softprops/action-gh-release uploads assets with the default token.
  contents: write

env:
  RUSTFLAGS: "-D warnings"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  FOUNDRY_VERSION: v1.7.1
  RUST_VERSION: 1.97.1
  NIGHTLY: nightly-2026-08-10

jobs:
  # The same gate as ci.yml, re-run against the released ref: a release
  # event carries no `needs:` edge to another workflow's jobs, so the checks
  # run here before anything is built or uploaded.
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: rustfmt
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo +nightly fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all

  build:
    name: Build ${{ matrix.target }}
    needs: checks
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        id: package
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          name="libid-deploy-${version}-${TARGET}"
          mkdir "$name"
          cp "target/${TARGET}/release/libid-deploy" "$name/"
          tar -czf "${name}.tar.gz" "$name"
          echo "asset=${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        uses: softprops/action-gh-release@1853d73993c8ca1b2c9c1a7fede39682d0ab5c2a # v2.5.3
        with:
          files: ${{ steps.package.outputs.asset }}
