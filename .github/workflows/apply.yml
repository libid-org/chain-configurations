name: Apply

# Apply a network's desired-state file to its chain, signing with an AWS KMS
# key.
#
# WHY KMS AND NOT A GITHUB SECRET: the deployer owns every UUPS proxy in
# the stack. A leaked deployer key means an attacker can upgrade them to
# arbitrary code. A KMS key cannot be exported — CI calls
# kms:Sign and gets a signature back — so a compromised runner can sign
# while the job runs but cannot walk away with the key. Revocation is an IAM
# change, not a redeploy.
#
# THE ENDPOINT IS THE OTHER SECRET. A real network's file names no
# endpoint: the run takes it from the `RPC_URL` secret of the network's
# GitHub environment, passed as `--rpc-url` on every call, and a network
# whose environment lacks the secret fails before anything is read. The
# provider's key rides in the URL. GitHub masks the value in the job log;
# the step summaries are written through `redact` because a summary is not
# masked, and libid-deploy itself names an endpoint by its origin alone.
#
# THIS WORKFLOW IS MANUAL ONLY. It never runs on push. `mode: plan` (the
# default) is read-only; `mode: apply` sends transactions. The network file
# is DECLARATIVE: it already carries every canonical address (validated to
# equal the CREATE3 prediction), presence is read from chain state, and
# apply never rewrites the file — so there is no write-back and no PR step.
# The run's plan and apply summaries land in the step summary.
#
# THE BINARY IS NAMED AT DISPATCH. `source: release` runs the asset of the
# tag in `release`, never "the latest". The `guard` job shows that asset's
# sha256 before an approval is asked for, and the apply job refuses a
# download with any other. A branch build, and a `contracts_ref`, run only on
# a network whose file signs with the testnet deployer key: the guard refuses
# them anywhere else.

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Network file under networks/ (add new networks to this list)"
        type: choice
        # A network's FIRST apply needs confirm_fresh_deploy: the factory
        # is virgin on that chain. local-dev is deliberately absent: it has
        # no KMS key and its chain exists only inside a CI run.
        options: [eden-testnet, sepolia, arbitrum-sepolia, ethereum, arbitrum, base, bsc, eden]
        default: eden-testnet
      mode:
        description: "plan is read-only; apply sends transactions"
        type: choice
        options: [plan, apply]
        default: plan
      upgrade:
        description: "Comma list to explicitly upgrade: notary-service, proof-verifier, identity-registry, handle-escrow, google-jwt-roots, x-platform-verifier, github-platform-verifier, google-platform-verifier"
        type: string
        default: ""
      confirm_fresh_deploy:
        description: "Required ONLY when the LibidFactory has no code on-chain (virgin network): that first apply publishes the whole declared stack."
        type: boolean
        default: false
      fund:
        description: "Top up each [funding.<name>] address to its declared balance from the deployer (testnet files only). Runs a full apply: run plan first and fund only when it shows nothing but funding.* lines."
        type: boolean
        default: false
      source:
        description: "Where the libid-deploy binary comes from: a release asset, or a build of the dispatched branch (testnet deployer key only)"
        type: choice
        options: [release, branch]
        default: release
      release:
        description: "With source: release, the release tag whose libid-deploy runs, for example v0.23.0"
        type: string
        default: ""
      contracts_ref:
        description: "With source: branch, a libid-contracts commit (40-hex SHA) to build against instead of the crates.io release (testnet deployer key only)"
        type: string
        default: ""

# Never let two applies touch the same chain at once. Cancelling mid-flight
# is NOT safe — a half-applied upgrade is worse than a queued one — so
# in-progress runs are allowed to finish.
concurrency:
  group: apply-${{ inputs.network }}
  cancel-in-progress: false

permissions:
  contents: read # checkout only — apply never writes the network file back
  id-token: write # required to mint the OIDC token AWS exchanges for a role

env:
  FOUNDRY_VERSION: v1.7.1

jobs:
  # No environment, so a refused dispatch fails before a reviewer is asked to
  # approve it and before any AWS credential exists.
  guard:
    name: Check the inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      asset: ${{ steps.check.outputs.asset }}
      sha256: ${{ steps.check.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # With source: release it also reads the Linux asset's sha256 from the
      # release, writes it to the summary the approver sees, and hands it to
      # the apply job, which refuses any other bytes.
      - name: Refuse a binary this network may not run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          NETWORK: ${{ inputs.network }}
          SOURCE: ${{ inputs.source }}
          RELEASE: ${{ inputs.release }}
          CONTRACTS_REF: ${{ inputs.contracts_ref }}
          TESTNET_KEY: alias/libid-testnet-deployer
        run: |
          set -euo pipefail
          file="networks/$NETWORK.toml"
          [ -s "$file" ] || { echo "::error::$file is missing or empty"; exit 1; }
          key=$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["aws"]["kms_deployer"])' "$file")
          if [ "$SOURCE" = "branch" ] || [ -n "$CONTRACTS_REF" ]; then
            [ "$key" = "$TESTNET_KEY" ] || {
              echo "::error::$NETWORK signs with $key: a branch build or a contracts_ref runs only on a network signed by $TESTNET_KEY; dispatch source: release with a release tag"
              exit 1
            }
          fi
          case "$SOURCE" in
            release)
              [[ "$RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
                { echo "::error::source: release needs release, a tag such as v0.23.0"; exit 1; }
              [ -z "$CONTRACTS_REF" ] || { echo "::error::contracts_ref needs source: branch"; exit 1; }
              asset="libid-deploy-${RELEASE#v}-x86_64-unknown-linux-gnu.tar.gz"
              # shellcheck disable=SC2016 # $ENV is jq's, read from the ASSET variable
              digest=$(ASSET="$asset" gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE" \
                         --jq '.assets[] | select(.name == $ENV.ASSET) | .digest') ||
                { echo "::error::no release $RELEASE in $GITHUB_REPOSITORY"; exit 1; }
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] ||
                { echo "::error::release $RELEASE has no $asset with a sha256 digest"; exit 1; }
              {
                echo "asset=$asset"
                echo "sha256=${digest#sha256:}"
              } >> "$GITHUB_OUTPUT"
              {
                echo "### Binary"
                echo "- libid-deploy $RELEASE"
                echo "- $asset sha256 \`${digest#sha256:}\`; the apply job refuses any other bytes"
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            branch)
              [ -z "$RELEASE" ] || { echo "::error::release names a tag for source: release; leave it empty with source: branch"; exit 1; }
              [ -z "$CONTRACTS_REF" ] || [[ "$CONTRACTS_REF" =~ ^[0-9a-f]{40}$ ]] ||
                { echo "::error::contracts_ref must be a full 40-hex commit SHA"; exit 1; }
              ;;
          esac
          echo "$NETWORK signs with $key; source: $SOURCE${RELEASE:+ $RELEASE}${CONTRACTS_REF:+, contracts $CONTRACTS_REF}"

  apply:
    name: ${{ inputs.network }} (${{ inputs.mode }})
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # A GitHub Environment protection rule on a production network (e.g.
    # `ethereum`) is what gates an apply behind a human approval. Configure
    # required reviewers there; this workflow deliberately does not
    # implement its own approval gate.
    environment:
      name: ${{ inputs.network }}
    env:
      NETWORK_FILE: networks/${{ inputs.network }}.toml
      # The endpoint of every call in this run. local-dev, the one file that
      # names its own, is never applied here.
      RPC_URL: ${{ secrets.RPC_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── Read what the run needs out of the network file ────────────────
      - name: Load network config
        id: cfg
        run: |
          set -euo pipefail
          [ -s "$NETWORK_FILE" ] || { echo "::error::$NETWORK_FILE is missing or empty"; exit 1; }
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, tomllib
          with open(os.environ["NETWORK_FILE"], "rb") as fh:
              cfg = tomllib.load(fh)
          print(f"aws_region={cfg['aws']['region']}")
          print(f"kms_key_id={cfg['aws']['kms_deployer']}")
          print(f"chain_id={cfg['network']['chain_id']}")
          PY
          [ -n "$RPC_URL" ] || {
            echo "::error::the ${{ inputs.network }} environment has no RPC_URL secret, and the network file names no endpoint"
            exit 1
          }
          echo "endpoint: the RPC_URL secret of the ${{ inputs.network }} environment"

      # ── The binary: the named release's asset, or cargo from the branch ─
      # A release asset can be replaced under its tag, so the tarball must
      # match the sha256 the guard job showed before approval, and the binary
      # must report the tag's version.
      - name: Download libid-deploy ${{ inputs.release }}
        if: inputs.source == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          ASSET: ${{ needs.guard.outputs.asset }}
          SHA256: ${{ needs.guard.outputs.sha256 }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET" --output libid-deploy.tar.gz
          sum=$(sha256sum libid-deploy.tar.gz | cut -d' ' -f1)
          [ "$sum" = "$SHA256" ] ||
            { echo "::error::$ASSET has sha256 $sum, not $SHA256, which the guard job showed before approval"; exit 1; }
          tar -xzf libid-deploy.tar.gz --strip-components=1
          chmod +x libid-deploy
          reported=$(./libid-deploy --version)
          [ "$reported" = "libid-deploy ${RELEASE#v}" ] ||
            { echo "::error::the $RELEASE asset reports \"$reported\", not \"libid-deploy ${RELEASE#v}\""; exit 1; }
          echo "libid-deploy $RELEASE, $ASSET sha256 $SHA256"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: inputs.source == 'branch'
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: inputs.source == 'branch'
      # ── Optionally, an unreleased libid-contracts commit ───────────────
      # The crate embeds forge artifacts that are generated, not committed,
      # so a git dependency cannot build: the commit is checked out, built
      # and vendored here, and cargo patches the registry crate to it. The
      # guard job has checked the ref's form and that the network allows it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.contracts_ref != ''
        with:
          repository: libid-org/libid-contracts
          ref: ${{ inputs.contracts_ref }}
          path: libid-contracts
          submodules: recursive
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        if: inputs.contracts_ref != ''
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: Vendor the libid-contracts artifacts
        if: inputs.contracts_ref != ''
        working-directory: libid-contracts
        env:
          CONTRACTS_REF: ${{ inputs.contracts_ref }}
        run: |
          set -euo pipefail
          ./scripts/vendor-circuit-verifiers.sh
          ./scripts/vendor-artifacts.sh
          echo "- libid-contracts $CONTRACTS_REF" >> "$GITHUB_STEP_SUMMARY"

      - name: Build libid-deploy from this branch
        if: inputs.source == 'branch'
        env:
          CONTRACTS_REF: ${{ inputs.contracts_ref }}
        run: |
          set -euo pipefail
          if [ -n "$CONTRACTS_REF" ]; then
            patch=(--config 'patch.crates-io.libid-contracts.path="libid-contracts/rust/contracts"')
            # The lock names the registry release; moving it to the patched
            # crate is what makes cargo use the checkout.
            cargo update "${patch[@]}" -p libid-contracts
            cargo build --release "${patch[@]}"
            used=$(cargo tree "${patch[@]}" -i libid-contracts --depth 0)
            [[ "$used" == *"/libid-contracts/rust/contracts)"* ]] ||
              { echo "::error::the build did not use the libid-contracts checkout"; exit 1; }
            # The committed lock stays the one the release builds from.
            git checkout -- Cargo.lock
          else
            cargo build --release
          fi
          cp target/release/libid-deploy .
          ./libid-deploy --version
          echo "- libid-deploy built from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      # ── AWS ────────────────────────────────────────────────────────────
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYER_ROLE_ARN }}
          aws-region: ${{ steps.cfg.outputs.aws_region }}

      # `cast` derives the deployer address from the KMS public key below.
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      # Proves the role can actually sign with this key, and prints the
      # address that will own the contracts. Doing this BEFORE any
      # transaction means a permissions problem costs nothing.
      - name: Verify KMS signing identity
        id: identity
        env:
          KMS_KEY_ID: ${{ steps.cfg.outputs.kms_key_id }}
        run: |
          set -euo pipefail
          spec=$(aws kms describe-key --key-id "$KMS_KEY_ID" \
                   --query 'KeyMetadata.[KeySpec,KeyUsage,Enabled]' --output text)
          echo "key spec: $spec"
          case "$spec" in
            "ECC_SECG_P256K1	SIGN_VERIFY	True") ;;
            *) echo "::error::key $KMS_KEY_ID is not an enabled secp256k1 SIGN_VERIFY key ($spec)"
               exit 1 ;;
          esac

          # Derive the Ethereum address from the KMS public key: keccak the
          # 64-byte EC point and take the low 20 bytes — the same derivation
          # alloy performs. A DER SubjectPublicKeyInfo for a secp256k1 key
          # ends with 0x04 || X || Y, so the trailing 64 bytes are the point.
          aws kms get-public-key --key-id "$KMS_KEY_ID" --output text \
            --query PublicKey | base64 -d > /tmp/pub.der
          point=$(tail -c 64 /tmp/pub.der | xxd -p -c 64)
          [ "${#point}" -eq 128 ] || { echo "::error::unexpected public key length ${#point}"; exit 1; }
          addr="0x$(cast keccak "0x${point}" | tail -c 41)"
          echo "deployer address: $addr"
          echo "address=$addr" >> "$GITHUB_OUTPUT"

      - name: Deployer balance is nonzero
        env:
          ADDR: ${{ steps.identity.outputs.address }}
        run: |
          set -euo pipefail
          bal=$(cast balance "$ADDR" --rpc-url "$RPC_URL")
          echo "deployer balance: $(cast from-wei "$bal") (native)"
          if [ "$bal" = "0" ]; then
            echo "::error::deployer $ADDR has zero balance — fund it before applying."
            exit 1
          fi

      # ── Plan, always ───────────────────────────────────────────────────
      - name: Plan
        run: |
          set -euo pipefail
          redact() { python3 -c 'import os, sys; s = sys.stdin.read(); u = os.environ.get("RPC_URL", ""); sys.stdout.write(s.replace(u, "<RPC_URL>") if u else s)'; }
          ./libid-deploy validate --network "$NETWORK_FILE" --rpc-url "$RPC_URL"
          ./libid-deploy plan --network "$NETWORK_FILE" --rpc-url "$RPC_URL" | tee /tmp/plan.txt
          {
            echo "### Plan — ${{ inputs.network }}"
            echo '```'
            redact < /tmp/plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Apply, only when asked ─────────────────────────────────────────
      - name: Apply
        if: inputs.mode == 'apply'
        env:
          AWS_REGION: ${{ steps.cfg.outputs.aws_region }}
          UPGRADE: ${{ inputs.upgrade }}
          CONFIRM_FRESH: ${{ inputs.confirm_fresh_deploy }}
          FUND: ${{ inputs.fund }}
        run: |
          set -euo pipefail
          redact() { python3 -c 'import os, sys; s = sys.stdin.read(); u = os.environ.get("RPC_URL", ""); sys.stdout.write(s.replace(u, "<RPC_URL>") if u else s)'; }
          args=(--network "$NETWORK_FILE" --rpc-url "$RPC_URL" --yes)
          # The signer defaults to aws.kms_deployer from the network file.
          [ -n "$UPGRADE" ] && args+=(--upgrade "$UPGRADE")
          [ "$CONFIRM_FRESH" = "true" ] && args+=(--confirm-fresh-deploy)
          [ "$FUND" = "true" ] && args+=(--fund)
          ./libid-deploy apply "${args[@]}" 2>&1 | tee /tmp/apply.log
          {
            echo "### Apply — ${{ inputs.network }}"
            echo '```'
            tail -60 /tmp/apply.log | redact
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The config is declarative and apply never rewrites it, so the tree
      # MUST be clean afterwards — anything else is a bug worth failing on.
      - name: Working tree is untouched
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            echo "::error::apply modified the working tree — the declarative model forbids write-back"
            git diff
            exit 1
          fi
          echo "Config untouched, as declared."
