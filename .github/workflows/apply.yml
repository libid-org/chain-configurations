name: Apply

# Apply a network's desired-state file to its chain, signing with an AWS KMS
# key.
#
# WHY KMS AND NOT A GITHUB SECRET: the deployer owns every UUPS proxy and
# the Bank diamond. A leaked deployer key means an attacker can upgrade them
# to arbitrary code and drain them. A KMS key cannot be exported — CI calls
# kms:Sign and gets a signature back — so a compromised runner can sign
# while the job runs but cannot walk away with the key. Revocation is an IAM
# change, not a redeploy.
#
# THIS WORKFLOW IS MANUAL ONLY. It never runs on push. `mode: plan` (the
# default) is read-only; `mode: apply` sends transactions. The network file
# is DECLARATIVE: it already carries every canonical address (validated to
# equal the CREATE3 prediction), presence is read from chain state, and
# apply never rewrites the file — so there is no write-back and no PR step.
# The run's plan and apply summaries land in the step summary.

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Network file under networks/ (add new networks to this list)"
        type: choice
        # eden-testnet is a LEGACY record: plan works, apply refuses it.
        options: [eden-testnet]
        default: eden-testnet
      mode:
        description: "plan is read-only; apply sends transactions"
        type: choice
        options: [plan, apply]
        default: plan
      upgrade:
        description: "Comma list to explicitly upgrade: registry, wallet-factory, notary, bank, oidc-verifier"
        type: string
        default: ""
      confirm_fresh_deploy:
        description: "Required ONLY when the LibidFactory has no code on-chain (virgin network): that first apply publishes the whole declared stack."
        type: boolean
        default: false
      source:
        description: "Where the libid-deploy binary comes from"
        type: choice
        options: [release, branch]
        default: release

# Never let two applies touch the same chain at once. Cancelling mid-flight
# is NOT safe — a half-applied upgrade is worse than a queued one — so
# in-progress runs are allowed to finish.
concurrency:
  group: apply-${{ inputs.network }}
  cancel-in-progress: false

permissions:
  contents: read # checkout only — apply never writes the network file back
  id-token: write # required to mint the OIDC token AWS exchanges for a role

jobs:
  apply:
    name: ${{ inputs.network }} (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # A GitHub Environment protection rule on a production network (e.g.
    # `mainnet`) is what gates an apply behind a human approval. Configure
    # required reviewers there; this workflow deliberately does not
    # implement its own approval gate.
    environment:
      name: ${{ inputs.network }}
    env:
      NETWORK_FILE: networks/${{ inputs.network }}.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── Read what the run needs out of the network file ────────────────
      - name: Load network config
        id: cfg
        run: |
          set -euo pipefail
          [ -s "$NETWORK_FILE" ] || { echo "::error::$NETWORK_FILE is missing or empty"; exit 1; }
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, tomllib
          with open(os.environ["NETWORK_FILE"], "rb") as fh:
              cfg = tomllib.load(fh)
          print(f"aws_region={cfg['aws']['region']}")
          print(f"kms_key_id={cfg['aws']['kms_deployer']}")
          print(f"rpc_url={cfg['network']['rpc_url']}")
          print(f"chain_id={cfg['network']['chain_id']}")
          PY

      # ── The binary: a release asset by default, cargo from the branch ──
      - name: Download libid-deploy from the latest release
        if: inputs.source == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern '*-x86_64-unknown-linux-gnu.tar.gz' --output libid-deploy.tar.gz
          tar -xzf libid-deploy.tar.gz --strip-components=1
          chmod +x libid-deploy
          ./libid-deploy --version

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: inputs.source == 'branch'
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: inputs.source == 'branch'
      - name: Build libid-deploy from this branch
        if: inputs.source == 'branch'
        run: |
          set -euo pipefail
          cargo build --release
          cp target/release/libid-deploy .
          ./libid-deploy --version

      # ── AWS ────────────────────────────────────────────────────────────
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@a03048d87541d1d9fcf2ecf528a4a65ba9bd7838 # v5.0.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYER_ROLE_ARN }}
          aws-region: ${{ steps.cfg.outputs.aws_region }}

      # `cast` derives the deployer address from the KMS public key below.
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.1

      # Proves the role can actually sign with this key, and prints the
      # address that will own the contracts. Doing this BEFORE any
      # transaction means a permissions problem costs nothing.
      - name: Verify KMS signing identity
        id: identity
        env:
          KMS_KEY_ID: ${{ steps.cfg.outputs.kms_key_id }}
        run: |
          set -euo pipefail
          spec=$(aws kms describe-key --key-id "$KMS_KEY_ID" \
                   --query 'KeyMetadata.[KeySpec,KeyUsage,Enabled]' --output text)
          echo "key spec: $spec"
          case "$spec" in
            "ECC_SECG_P256K1	SIGN_VERIFY	True") ;;
            *) echo "::error::key $KMS_KEY_ID is not an enabled secp256k1 SIGN_VERIFY key ($spec)"
               exit 1 ;;
          esac

          # Derive the Ethereum address from the KMS public key: keccak the
          # 64-byte EC point and take the low 20 bytes — the same derivation
          # alloy performs. A DER SubjectPublicKeyInfo for a secp256k1 key
          # ends with 0x04 || X || Y, so the trailing 64 bytes are the point.
          aws kms get-public-key --key-id "$KMS_KEY_ID" --output text \
            --query PublicKey | base64 -d > /tmp/pub.der
          point=$(tail -c 64 /tmp/pub.der | xxd -p -c 64)
          [ "${#point}" -eq 128 ] || { echo "::error::unexpected public key length ${#point}"; exit 1; }
          addr="0x$(cast keccak "0x${point}" | tail -c 41)"
          echo "deployer address: $addr"
          echo "address=$addr" >> "$GITHUB_OUTPUT"

      - name: Deployer balance is nonzero
        env:
          RPC_URL: ${{ steps.cfg.outputs.rpc_url }}
          ADDR: ${{ steps.identity.outputs.address }}
        run: |
          set -euo pipefail
          bal=$(cast balance "$ADDR" --rpc-url "$RPC_URL")
          echo "deployer balance: $(cast from-wei "$bal") (native)"
          if [ "$bal" = "0" ]; then
            echo "::error::deployer $ADDR has zero balance — fund it before applying."
            exit 1
          fi

      # ── Plan, always ───────────────────────────────────────────────────
      - name: Plan
        run: |
          set -euo pipefail
          ./libid-deploy validate --network "$NETWORK_FILE"
          ./libid-deploy plan --network "$NETWORK_FILE" | tee /tmp/plan.txt
          {
            echo "### Plan — ${{ inputs.network }}"
            echo '```'
            cat /tmp/plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Apply, only when asked ─────────────────────────────────────────
      - name: Apply
        if: inputs.mode == 'apply'
        env:
          AWS_REGION: ${{ steps.cfg.outputs.aws_region }}
          UPGRADE: ${{ inputs.upgrade }}
          CONFIRM_FRESH: ${{ inputs.confirm_fresh_deploy }}
        run: |
          set -euo pipefail
          args=(--network "$NETWORK_FILE" --yes)
          # The signer defaults to aws.kms_deployer from the network file.
          [ -n "$UPGRADE" ] && args+=(--upgrade "$UPGRADE")
          [ "$CONFIRM_FRESH" = "true" ] && args+=(--confirm-fresh-deploy)
          ./libid-deploy apply "${args[@]}" 2>&1 | tee /tmp/apply.log
          {
            echo "### Apply — ${{ inputs.network }}"
            echo '```'
            tail -60 /tmp/apply.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The config is declarative and apply never rewrites it, so the tree
      # MUST be clean afterwards — anything else is a bug worth failing on.
      - name: Working tree is untouched
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            echo "::error::apply modified the working tree — the declarative model forbids write-back"
            git diff
            exit 1
          fi
          echo "Config untouched, as declared."
