# Eden testnet — desired state for the libid contract stack.
#
# Every address under [contracts] and [identity] is CANONICAL: each entry deploys
# through LibidFactory via CREATE3 with `salt = keccak256(canonical name)`, so an
# address depends only on the contract's name — not its bytecode, not its
# constructor arguments, not which chain it is on. They are identical on every EVM
# chain, and `validate` enforces that equality offline. Regenerate the table with
# `libid-deploy plan --print-addresses`, never by hand.
#
# The first apply needs `confirm_fresh_deploy: true` while the factory is not yet
# deployed here; that guard reads chain state, not this file.
#
# HOW TO READ THIS FILE
#
# Every value here is public: contract addresses, a public RPC, and OAuth
# *client ids* (not secrets). The only secret in the flow is the KMS key,
# which never leaves AWS.
#
# INPUT keys describe what should exist: accounts, client ids, tokens,
# templates. You edit these.
#
# OUTPUT keys are everything under [contracts] and [identity]. Since
# libid-deploy 0.4.0 they are pre-filled and declarative: `apply` reads
# chain state to decide what is missing and NEVER rewrites this file.

[network]
name = "eden-testnet"
chain_id = 3735928814
rpc_url = "https://ev-reth-eden-testnet.binarybuilders.services:8545"

[aws]
region = "eu-central-1"
# The deployer's KMS key. It owns every UUPS proxy and the Bank diamond.
#
# It must be the FACTORY GENESIS ADMIN, and it is: this alias derives to
# 0x5bb76b0f81f028de363150602cc6d0ca929e3c31, which is the address baked into
# the factory's frozen init code (FactoryGenesis.sol:25). `factory.deploy` is
# owner-gated and impersonation is refused on real chains, so no other key can
# perform this apply. Verified funded on Eden.
kms_deployer = "alias/dyaka-testnet-deployer"

# The ADDRESSES OF KEYS, not contracts.
[accounts]
# The notary SIGNER — the identity whose signatures the whole stack accepts.
# `apply` initializes the Notary CONTRACT with this and `setNotary`s it when
# they drift, so this one value rotates every consumer at once. Both notary
# service instances (the wallet product's and the identity product's) sign
# with this key.
notary = "0x7a3646e8431a4b0c8bb586a7d26d7da7ae4aa2b5"

# The WALLET PRODUCT's backend signing identity (alias/dyaka-testnet-backend),
# wired into Registry.initialize(_backend) and the Bank diamond. The Bank grants
# it the backend role, which is the authority to move user funds — so this value
# matters, and it is the one that cannot be corrected afterwards: the Bank sets
# its backend once in BankInit and exposes no setter, short of a diamond facet
# upgrade. Registry does have `setBackend` (onlyOwner).
#
# Nothing under [identity] reads this — the notary is the identity stack's only
# trust root and libid-server-rs holds no key. The field is required for the
# two wallet contracts above.
backend = "0xe9b132c2eccca08efaf62d18c301945f38ddc267"

# The operational owner the factory ends up with. Empty = the deployer, which
# on this network IS the KMS genesis admin, so the default is exact.
owner = ""

# OUTPUT: the canonical contract addresses. Do not hand-edit.
[contracts]
factory = "0xa92244c3f4462aad08bd1a33c3940b9b936321ad"
notary = "0x4bddfe9fb875d03838e5013c338e2dea9dcc2fc5"
bank = "0x060708036a9ee89c6513346abab0929427bc9b06"
registry = "0x03c2b8d5f4d5cf7b7f81f876035046e262c4c9c9"
wallet_factory = "0x945b8a7a480a2552ec3c61c24d4363c9558107a8"
x_zk_verifier = "0xf8ddccfebfefdc5cbae308f0aac9a12e275eda5f"
google_oidc_verifier = "0xef53a51e3a46e5f82248a39ddff0b7b901ab438c"

# OUTPUT: the identity-names stack. A key being PRESENT is what requests it.
#
# All five are requested: GitHub needs only the Notary contract, while X and
# Google each need a large Honk circuit verifier, and Google additionally needs
# the JWKS trust list — declaring `google_identity_verifier` without
# `identity_jwks_roots` fails validation.
[identity]
identity_names = "0xd467d48769c26faee36ba6b6fc9228f14aef6dd2"
github_identity_verifier = "0x936067c1b5d77c67358210e77f664382191d2015"
x_identity_verifier = "0xda66811e494a918e9ae0e5797206fca04333c055"
google_identity_verifier = "0x1b9db690ee040ca92d44d1585b3aab625a475c27"
# Deploys EMPTY. Until a keeper tick lands a notarized reading of Google's live
# JWKS, every Google claim reverts with UntrustedModulus(). The deployment repo
# runs the keeper hourly; the first tick has to be run deliberately, right after
# this apply.
identity_jwks_roots = "0x589b56f95d5df5483c79e46e7b20293135c9ebd9"

# INPUT: platform rules — OAuth client ids and the bot handles the on-chain
# templates mention. Client ids are bound into proofs on-chain (the OIDC
# verifier cannot be deployed without `google_client_id`; it becomes the
# expected JWT audience). Changing a client id after deploy is NOT applied to
# an already-deployed verifier — see `--upgrade oidc-verifier`.
#
# NOTE for when handles.link gets its own Google OAuth client: these ids are the
# audience the identity verifiers expect too, so either add the new origin's
# redirect URI to this same Google client, or plan an `--upgrade oidc-verifier`.
[platforms]
x_client_id = "TC1ub1JmTDNDSlJjajUxanlrOXA6MTpjaQ"
google_client_id = "391814431594-1piqeo3a0g2lmnmpseto3106tde3ja97.apps.googleusercontent.com"
github_bot_handle = "testyakly"
x_bot_handle = "testyakly"

# INPUT: tokens registered on the Bank. `apply` re-sends registration and
# tolerates "already registered" errors, so entries are safe to keep.
[[tokens]]
symbol = "$TIA"
address = "0x0000000000000000000000000000000000000000" # native

[[tokens]]
symbol = "$WTIA"
address = "0x3e806727b92d676032Ac7EBC7401a46a3ccDA688"

[[tokens]]
symbol = "$USDC"
address = "0x0C1c5a78669ea6cb269883ad1B65334319Aacfd7"

[[tokens]]
symbol = "$TEST"
address = "0x0D136f5F3C27Bf87E7d00B7516DABD5deead01FA"

# INPUT: platform comment templates pushed to the Bank (@testyakly bots).
# `apply` clears each listed platform first (setPlatformTemplate is
# append-only on-chain) and re-seeds exactly this list, so what a reader sees
# here matches what is on-chain.
#
# The template string must appear in the user's post/comment for verification.
# Use {recipient}, {amount} and {token} placeholders. A template may omit
# {recipient} (recipient-less form) — the recipient is then inferred from the
# reply/quote parent.
[templates]
"api.github.com" = [
    "@testyakly honor @{recipient} with {amount} of {token}",
    "@testyakly honor @{recipient} with {amount} {token}",
    # Recipient-less omitted for GitHub: no reply-target proof yet — the
    # on-chain _verifyRecipientIdLeaf needs a proven in_reply_to_user_id.
]
"api.x.com" = [
    "@testyakly honor @{recipient} with {amount} of {token}",
    "@testyakly honor @{recipient} with {amount} {token}",
    "@testyakly honor with {amount} of {token}",
    "@testyakly honor with {amount} {token}",
]
