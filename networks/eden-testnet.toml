# Eden testnet — desired state for the libid identity stack.
#
# Every address under [contracts] is CANONICAL: each entry deploys through
# LibidFactory via CREATE3 with `salt = keccak256(canonical name)`, so an address
# depends only on the contract's name — not its bytecode, not its constructor
# arguments, not which chain it is on. They are identical on every EVM chain, and
# `validate` enforces that equality offline. Regenerate the table with
# `libid-deploy plan --print-addresses`, never by hand.
#
# The first apply needs `confirm_fresh_deploy: true` while the factory is not yet
# deployed here; that guard reads chain state, not this file.
#
# HOW TO READ THIS FILE
#
# Every value here is public: contract addresses and a public RPC. The only
# secret in the flow is the KMS key, which never leaves AWS.
#
# INPUT keys describe what should exist: the accounts the contracts trust and the
# Notary Fee. You edit these.
#
# OUTPUT keys are everything under [contracts]. They are pre-filled and
# declarative: `apply` reads chain state to decide what is missing and NEVER
# rewrites this file.

[network]
name = "eden-testnet"
chain_id = 3735928814
rpc_url = "https://ev-reth-eden-testnet.binarybuilders.services:8545"

[aws]
region = "eu-central-1"
# The deployer's KMS key. It owns every UUPS proxy in the stack.
#
# It must be the FACTORY GENESIS ADMIN, and it is: this alias derives to
# 0x5bb76b0f81f028de363150602cc6d0ca929e3c31, which is the address baked into
# the factory's frozen init code (FactoryGenesis.sol). `factory.deploy` is
# owner-gated and impersonation is refused on real chains, so no other key can
# perform this apply.
kms_deployer = "alias/dyaka-testnet-deployer"

# The ADDRESSES OF KEYS, not contracts.
[accounts]
# The notary SIGNER — the identity whose attestations the whole stack accepts.
# `apply` initializes the Notary Service with this key and adds it to the
# trusted set when it is missing. Dropping an outgoing key is a separate
# governance call on purpose: the service holds a SET so a rotation can overlap,
# and which key to stop trusting is not something this file can say.
notary = "0x7a3646e8431a4b0c8bb586a7d26d7da7ae4aa2b5"

# The operational owner the factory ends up with. Empty = the deployer, which
# on this network IS the KMS genesis admin, so the default is exact.
owner = ""

[notary_service]
# What one attestation verification costs, in wei. Zero here: this testnet
# meters at no charge. The exact-value rule still applies — a submission must
# attach exactly `quoteClaim`, zero included — so the path is the same one
# mainnet will run with a real number.
fee_wei = "0"

# OUTPUT: the canonical contract addresses. Do not hand-edit.
[contracts]
factory = "0xa92244c3f4462aad08bd1a33c3940b9b936321ad"
notary_service = "0xbb5871167b0128939cab6850877981421e8dcbf5"
ceremony_proof_verifier = "0x76bdc18f21c2db0ff796c7cc50348528b2899275"
identity_names = "0xd467d48769c26faee36ba6b6fc9228f14aef6dd2"
# Deploys EMPTY. Until a keeper lands a notarized reading of Google's live JWKS,
# every Google claim reverts with UntrustedModulus(). The deployment repo runs
# the keeper hourly; the first tick has to be run deliberately, right after this
# apply.
google_jwt_roots = "0xb7a2ce28e71dbb9c877d2b5a48de33b5f0e6838d"
x_platform_verifier = "0xcfc880f62f2744dc000687edf47a98b585d9eb35"
github_platform_verifier = "0xac878389da7a1b58826182da0d8b4cae5e6e4178"
google_platform_verifier = "0xf3d537022362d187715b28bc547f8b2532e6d0cf"

# INPUT: the ceremony circuit verifier each platform's proofs are made under.
#
# A Platform Verifier pins its bb-generated UltraHonk verifier by ADDRESS and by
# CODE HASH: it reads the code at the address and refuses a hash that does not
# match, because such a verifier embeds its verification key as code constants
# and exposes no getter. `apply` therefore reads the code hash off the chain —
# only the address belongs here.
#
# A platform with no section below gets NO Platform Verifier: it owns its
# keyspace and can verify nothing, which is what `verifiesPlatform` reports.
# Nothing is invented to fill the gap; a verifier registered against a circuit
# nobody proved would accept proofs of a statement nobody made.
#
# Deploy the verifiers from a libid-circuits release first, then uncomment and
# fill these. Editing an address afterwards is the rotation path: apply sends
# `setTrustRoots`.
#
# [ceremony.x]
# circuit_verifier = ""
#
# [ceremony.github]
# circuit_verifier = ""
#
# [ceremony.google]
# circuit_verifier = ""
