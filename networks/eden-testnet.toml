# Eden testnet — desired state for the libid identity stack.
#
# Every address under [contracts] is CANONICAL: each entry deploys through
# LibidFactory via CREATE3 with `salt = keccak256(canonical name)`, so an address
# depends only on the contract's name — not its bytecode, not its constructor
# arguments, not which chain it is on. They are identical on every EVM chain, and
# `validate` enforces that equality offline. Regenerate the table with
# `libid-deploy plan --print-addresses`, never by hand.
#
# The first apply needs `confirm_fresh_deploy: true` while the factory is not yet
# deployed here; that guard reads chain state, not this file.
#
# HOW TO READ THIS FILE
#
# Every value here is public: contract addresses, accounts, the fee. The
# endpoint is not here: it is the `RPC_URL` secret of the `eden-testnet`
# GitHub environment (`--rpc-url` on a host). The other secret in the flow is
# the KMS key, which never leaves AWS.
#
# INPUT keys describe what should exist: the accounts the contracts trust and the
# Notary Fee. You edit these.
#
# OUTPUT keys are everything under [contracts]. They are pre-filled and
# declarative: `apply` reads chain state to decide what is missing and NEVER
# rewrites this file.

[network]
name = "eden-testnet"
chain_id = 3735928814

[aws]
region = "eu-central-1"
# The deployer's KMS key, in the libid-testnet AWS account. It owns every UUPS
# proxy in the stack and is the factory's genesis admin: this alias derives to
# accounts.deployer below, the address baked into the factory's init code.
# `factory.deploy` is owner-gated, so no other key can perform this apply.
kms_deployer = "alias/libid-testnet-deployer"

# The ADDRESSES OF KEYS, not contracts.
[accounts]
# The deployer, the address of aws.kms_deployer: the genesis admin of the
# factory, which every address under [contracts] is predicted from. The
# testnet deployer lives in the libid-testnet AWS account, so testnet has its
# own factory and its own table, apart from mainnet's.
deployer = "0xdaeb247f5a90c53f2d7a80a81f6cb6acb0d8b907"
# The notary SIGNER — the identity whose attestations the whole stack accepts.
# `apply` initializes the Notary Service with this key and adds it to the
# trusted set when it is missing. Dropping an outgoing key is a separate
# governance call on purpose: the service holds a SET so a rotation can overlap,
# and which key to stop trusting is not something this file can say.
notary = "0x569ae51d9c356f838c2811389a932b681cb6491c"

# The operational owner the factory ends up with. Empty = the deployer, which
# on this network IS the KMS genesis admin, so the default is exact.
owner = ""

[notary_service]
# What one attestation verification costs, in wei. Zero here: this testnet
# meters at no charge. The exact-value rule still applies — a submission must
# attach exactly `quoteBind`, zero included — so the path is the same one
# mainnet will run with a real number.
fee_wei = "0"

# OUTPUT: the canonical contract addresses. Do not hand-edit.
[contracts]
factory = "0x9dbf2b5f96cb31a48cca4e25d2c8348be414ebc8"
notary_service = "0xa773ec5e7500d1c87827ab1b899bbd992c1b5931"
ceremony_proof_verifier = "0xa795b14a2e09daf273bc6971058b0462c7d6be42"
identity_registry = "0x25f29c8c765db2f27d1e2b23987a7b0655c7d640"
# Initialized with identity_registry above, which it resolves every handle
# through for life: no setter moves it.
handle_escrow = "0x57355e1d1bcf61fec9b2e5cad60dcccdddc4d8e5"
# Deploys EMPTY. Until a keeper lands a notarized reading of Google's live JWKS,
# every Google binding reverts with UntrustedModulus(). The deployment repo runs
# the keeper hourly; the first tick has to be run deliberately, right after this
# apply.
google_jwt_roots = "0x8a14a5dda7662f88a5448b9b8b2ca9f1d5742904"
x_platform_verifier = "0x9f655c2fe778260d90f3202d97da0a46510aa3d0"
github_platform_verifier = "0xb5fdf35eedf7c849f3d1e41675d8b8a41487e248"
google_platform_verifier = "0x5cfb807545e0e2ce4d7dac7d97ab0583e3fbe1c6"

# The ceremony circuit verifiers are NOT declared here. `libid-deploy`
# carries them: `libid-contracts` embeds each circuit's bb-generated
# UltraHonk verifier from the libid-circuits release it pins, and apply
# deploys it through the factory under a CREATE3 name carrying that
# release and reads its code hash off the chain for the Platform Verifier
# to pin. Moving the contracts pin to a new circuits release and
# re-applying is the rotation path — a new release is a new name, a new
# address and a `setTrustRoots`, with the proxy and its registration
# untouched.
