# Local dev — the stack on a throwaway anvil, whether a docker-compose
# service or a bare process on a host or CI runner.
#
# `rpc_url` below is the compose service name, reachable only from inside
# that network. From anywhere else, keep this file as it is and name the
# endpoint on the command line: `--rpc-url` replaces the transport and
# nothing more — the chain id and every address declared here are the same
# either way.
#
#   docker compose up -d anvil
#   libid-deploy apply --network networks/local-dev.toml --yes \
#     --confirm-fresh-deploy
#
#   anvil --host 127.0.0.1 --port 8545 &
#   libid-deploy apply --network networks/local-dev.toml \
#     --rpc-url http://127.0.0.1:8545 --yes --confirm-fresh-deploy
#
# Anvil ships the CREATE2 deployer predeployed, so the factory bootstrap is
# one transaction; start it with `--disable-default-create2-deployer` to
# rehearse the keyless install path instead.
#
# NOTHING HERE IS SECRET. The keys below are anvil's own deterministic test
# accounts, printed by every anvil on startup and published in foundry's
# documentation. They control nothing outside a throwaway chain.
#
# This network is deliberately absent from the `network` choice list in
# .github/workflows/apply.yml: it has no KMS key and its chain exists only
# inside a CI run.

[network]
name = "local-dev"
chain_id = 31337
# The endpoint this file's own environment reaches: the compose service
# name. Every other caller passes `--rpc-url` and this value is not read;
# nothing else in the file depends on it.
rpc_url = "http://anvil:8545"

[aws]
# Never read on this network. The apply workflow parses it to pick a region
# for the OIDC role assumption, and that workflow does not list local-dev;
# `apply` itself takes credentials from the ambient AWS environment, which
# the local signer below never reaches.
region = "local"
# The default signer. `--signer` specs are classified by SHAPE: 64 hex
# characters is a local private key, anything else is a KMS key id — so
# this is anvil account #0's key, and no AWS call happens. On a real
# network this is an `alias/...` name and the key never leaves KMS.
kms_deployer = "ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"

# The ADDRESSES OF KEYS, not contracts.
[accounts]
# Anvil account #0, the address of the key above: the factory's genesis
# admin, so every address under [contracts] follows from it.
deployer = "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
# Anvil account #1. Separate from the deployer on purpose: the notary
# signer and the contract owner are different roles, and a local stack that
# collapses them hides a wiring mistake that a real deployment would show.
notary = "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
# Anvil account #0 — the deployer, named explicitly. A different owner
# would make apply start the Ownable2Step handover; on a dev chain it
# completes the acceptance by impersonation, so the stack ends fully owned.
owner = "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"

[notary_service]
# 0.001 native. NOT zero on purpose: a local stack that meters at no charge
# lets a client attaching the wrong value pass, and `WrongValue` is then
# first seen on a network where it costs something.
fee_wei = "1000000000000000"

# OUTPUT: the canonical contract addresses — identical on every EVM chain,
# this one included. Do not hand-edit; regenerate with
# `libid-deploy plan --print-addresses`.
[contracts]
factory = "0x13089b18e7fdcdedde55f6b85451561a8b725825"
notary_service = "0x278e8ba43e16e1d757fe77590edb759d85860483"
ceremony_proof_verifier = "0x7eb419023544487e5b4a61d6db043a8e29c4df4e"
identity_registry = "0x31874a585aab1f98121f14f4b2af68a93eaaa9a5"
# Initialized with identity_registry above, which it resolves every handle
# through for life: no setter moves it.
handle_escrow = "0x520996cdbccfffd952a5134dab146b6fac7b103c"
google_jwt_roots = "0x6d5bc82c9a8a6a05a9319c9e9d5fc43ff80552ac"
x_platform_verifier = "0xcced9e8428f4043d00d4d5dfc293d864bb2bc204"
github_platform_verifier = "0x4dfff81322459ca460e3ddede2b8dcb33bf10745"
google_platform_verifier = "0x5de9d5f806d872315bfdfde5b5eb8f97ebcb743d"

# The ceremony circuit verifiers are NOT declared here. `libid-deploy`
# carries them: `libid-contracts` embeds each circuit's bb-generated
# UltraHonk verifier from the libid-circuits release it pins, and apply
# deploys it through the factory under a CREATE3 name carrying that
# release. Each Platform Verifier implementation compiles in the code
# hash of its circuit's verifier, so a new circuits release is a new name,
# a new address, an `--upgrade` of the Platform Verifiers and a
# `setTrustRoots`, with the proxies and their registrations untouched.
